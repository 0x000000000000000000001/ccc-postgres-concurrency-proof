[package]
name = "ccc-postgres-concurrency-proof"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
rand = "0.10.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "json", "uuid"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.23.4", features = ["v4"] }

[dev-dependencies]
futures = "0.3"

[[bin]]
name = "benchmark"
path = "bin/benchmark.rs"

[[bin]]
name = "benchmark_read"
path = "bin/benchmark_read.rs"
